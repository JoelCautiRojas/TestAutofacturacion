<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feather (icomoon) â€” Demo de iconos</title>
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --bg: #1b1f24;
    --panel: #242a31;
    --panel-hover: #2e353d;
    --text: #e6e9ed;
    --muted: #9aa4af;
    --accent: #1c76ea;
    --border: #353d46;
    --ok: #14a075;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 600;
  }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .search {
    flex: 1 1 260px;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
  }
  .search .ico-prefix { color: var(--muted); font-size: 16px; }
  .search input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 10px 10px;
  }
  .sizes { display: flex; gap: 6px; }
  .sizes button {
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .sizes button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    padding: 24px;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
    text-align: center;
    min-height: 100px;
  }
  .cell:hover { background: var(--panel-hover); border-color: var(--accent); transform: translateY(-2px); }
  .cell [class^="icon-"] { color: var(--text); transition: transform .15s; }
  .cell:hover [class^="icon-"] { transform: scale(1.1); }
  .cell .name {
    font-size: 11px;
    color: var(--muted);
    word-break: break-word;
    line-height: 1.3;
  }
  .cell.copied { border-color: var(--ok); }
  .cell.copied .name { color: var(--ok); }

  /* tamaÃ±os de icono conmutables */
  .grid[data-size="1"] [class^="icon-"] { font-size: 24px; }
  .grid[data-size="2"] [class^="icon-"] { font-size: 36px; }
  .grid[data-size="3"] [class^="icon-"] { font-size: 52px; }

  .empty { padding: 60px; text-align: center; color: var(--muted); grid-column: 1/-1; }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ok);
    color: #fff;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>Feather <span style="font-weight:400;color:var(--muted);font-size:14px;">(icomoon)</span> &nbsp;<small>â€” <span id="total">0</span> iconos Â· clic para copiar la clase</small></h1>
  <div class="controls">
    <label class="search">
      <span class="icon-search ico-prefix"></span>
      <input type="text" id="buscar" placeholder="Buscar icono (ej: mail, folder, cloud)â€¦" autofocus>
    </label>
    <div class="sizes" id="sizes">
      <button data-size="1" class="active">S</button>
      <button data-size="2">M</button>
      <button data-size="3">L</button>
    </div>
    <span class="count" id="contador"></span>
  </div>
</header>

<div class="grid" id="grid" data-size="1"></div>
<div id="toast">Copiado</div>

<script>
// Lista completa de iconos extraÃ­da de style.css (Feather / icomoon, prefijo icon-)
var ICONS = ["activity","airplay","alert-circle","alert-octagon","alert-triangle","align-center","align-justify","align-left","align-right","anchor","aperture","archive","arrow-down","arrow-down-circle","arrow-down-left","arrow-down-right","arrow-left","arrow-left-circle","arrow-right","arrow-right-circle","arrow-up","arrow-up-circle","arrow-up-left","arrow-up-right","at-sign","award","bar-chart","bar-chart-2","battery","battery-charging","bell","bell-off","bluetooth","bold","book","book-open","bookmark","box","briefcase","calendar","camera","camera-off","cast","check","check-circle","check-square","chevron-down","chevron-left","chevron-right","chevron-up","chevrons-down","chevrons-left","chevrons-right","chevrons-up","chrome","circle","clipboard","clock","cloud","cloud-drizzle","cloud-lightning","cloud-off","cloud-rain","cloud-snow","code","codepen","codesandbox","coffee","columns","command","compass","copy","corner-down-left","corner-down-right","corner-left-down","corner-left-up","corner-right-down","corner-right-up","corner-up-left","corner-up-right","cpu","credit-card","crop","crosshair","database","delete","disc","dollar-sign","download","download-cloud","droplet","edit","edit-2","edit-3","external-link","eye","eye-off","facebook","fast-forward","feather","figma","file","file-minus","file-plus","file-text","film","filter","flag","folder","folder-minus","folder-plus","framer","frown","gift","git-branch","git-commit","git-merge","git-pull-request","github","gitlab","globe","grid","hard-drive","hash","headphones","heart","help-circle","hexagon","home","image","inbox","info","instagram","italic","key","layers","layout","life-buoy","link","link-2","linkedin","list","loader","lock","log-in","log-out","mail","map","map-pin","maximize","maximize-2","meh","menu","message-circle","message-square","mic","mic-off","minimize","minimize-2","minus","minus-circle","minus-square","monitor","moon","more-horizontal","more-vertical","mouse-pointer","move","music","navigation","navigation-2","octagon","package","paperclip","pause","pause-circle","pen-tool","percent","phone","phone-call","phone-forwarded","phone-incoming","phone-missed","phone-off","phone-outgoing","pie-chart","play","play-circle","plus","plus-circle","plus-square","pocket","power","printer","radio","refresh-ccw","refresh-cw","repeat","rewind","rotate-ccw","rotate-cw","rss","save","scissors","search","send","server","settings","share","share-2","shield","shield-off","shopping-bag","shopping-cart","shuffle","sidebar","skip-back","skip-forward","slack","slash","sliders","smartphone","smile","speaker","square","star","stop-circle","sun","sunrise","sunset","tablet","tag","target","terminal","thermometer","thumbs-down","thumbs-up","toggle-left","toggle-right","tool","trash","trash-2","trello","trending-down","trending-up","triangle","truck","tv","twitch","twitter","type","umbrella","underline","unlock","upload","upload-cloud","user","user-check","user-minus","user-plus","user-x","users","video","video-off","voicemail","volume","volume-1","volume-2","volume-x","watch","wifi","wifi-off","wind","x","x-circle","x-octagon","x-square","youtube","zap","zap-off","zoom-in","zoom-out"];

var grid = document.getElementById('grid');
var buscar = document.getElementById('buscar');
var contador = document.getElementById('contador');
var toast = document.getElementById('toast');
document.getElementById('total').textContent = ICONS.length;
var toastTimer;

function render(filtro) {
  filtro = (filtro || '').trim().toLowerCase();
  var lista = filtro ? ICONS.filter(function(n){ return n.indexOf(filtro) !== -1; }) : ICONS;
  grid.innerHTML = '';
  if (lista.length === 0) {
    grid.innerHTML = '<div class="empty">Sin resultados para "' + filtro + '"</div>';
    contador.textContent = '0 iconos';
    return;
  }
  var frag = document.createDocumentFragment();
  lista.forEach(function(name){
    var cls = 'icon-' + name;
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.title = 'Clic para copiar: ' + cls;
    cell.dataset.cls = cls;
    cell.innerHTML = '<span class="' + cls + '"></span><span class="name">' + name + '</span>';
    frag.appendChild(cell);
  });
  grid.appendChild(frag);
  contador.textContent = lista.length + ' iconos';
}

function copiar(texto, cell) {
  function ok() {
    cell.classList.add('copied');
    setTimeout(function(){ cell.classList.remove('copied'); }, 900);
    showToast('Copiado: ' + texto);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(ok, function(){ fallback(texto); ok(); });
  } else {
    fallback(texto); ok();
  }
}
function fallback(texto) {
  var ta = document.createElement('textarea');
  ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1400);
}

grid.addEventListener('click', function(e){
  var cell = e.target.closest('.cell');
  if (!cell) return;
  copiar(cell.dataset.cls, cell);
});

buscar.addEventListener('input', function(){ render(this.value); });

document.getElementById('sizes').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  this.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  grid.dataset.size = btn.dataset.size;
});

render('');
</script>
</body>
</html>
