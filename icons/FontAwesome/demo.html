<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FontAwesome 4.5.0 — Demo de iconos</title>
<link rel="stylesheet" href="style.css">
<style>
  :root {
    --bg: #1b1f24;
    --panel: #242a31;
    --panel-hover: #2e353d;
    --text: #e6e9ed;
    --muted: #9aa4af;
    --accent: #1c76ea;
    --border: #353d46;
    --ok: #14a075;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  h1 {
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 600;
  }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .search {
    flex: 1 1 260px;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
  }
  .search .fa { color: var(--muted); }
  .search input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--text);
    font-size: 15px;
    padding: 10px 10px;
  }
  .sizes { display: flex; gap: 6px; }
  .sizes button {
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .sizes button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .count { color: var(--muted); font-size: 13px; margin-left: auto; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 10px;
    padding: 24px;
  }
  .cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 18px 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
    text-align: center;
    min-height: 100px;
  }
  .cell:hover { background: var(--panel-hover); border-color: var(--accent); transform: translateY(-2px); }
  .cell .fa { color: var(--text); transition: transform .15s; }
  .cell:hover .fa { transform: scale(1.1); }
  .cell .name {
    font-size: 11px;
    color: var(--muted);
    word-break: break-word;
    line-height: 1.3;
  }
  .cell.copied { border-color: var(--ok); }
  .cell.copied .name { color: var(--ok); }

  /* tamaños de icono conmutables */
  .grid[data-size="1"] .fa { font-size: 24px; }
  .grid[data-size="2"] .fa { font-size: 36px; }
  .grid[data-size="3"] .fa { font-size: 52px; }

  .empty { padding: 60px; text-align: center; color: var(--muted); grid-column: 1/-1; }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ok);
    color: #fff;
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    box-shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>FontAwesome 4.5.0 &nbsp;<small>— <span id="total">0</span> iconos · clic para copiar la clase</small></h1>
  <div class="controls">
    <label class="search">
      <span class="fa fa-search"></span>
      <input type="text" id="buscar" placeholder="Buscar icono (ej: user, arrow, calendar)…" autofocus>
    </label>
    <div class="sizes" id="sizes">
      <button data-size="1" class="active">S</button>
      <button data-size="2">M</button>
      <button data-size="3">L</button>
    </div>
    <span class="count" id="contador"></span>
  </div>
</header>

<div class="grid" id="grid" data-size="1"></div>
<div id="toast">Copiado</div>

<script>
// Lista completa de iconos extraída de style.css (FontAwesome 4.5.0)
var ICONS = ["glass","music","search","envelope-o","heart","star","star-o","user","film","th-large","th","th-list","check","search-plus","search-minus","power-off","signal","trash-o","home","file-o","clock-o","road","download","arrow-circle-o-down","arrow-circle-o-up","inbox","play-circle-o","refresh","list-alt","lock","flag","headphones","volume-off","volume-down","volume-up","qrcode","barcode","tag","tags","book","bookmark","print","camera","font","bold","italic","text-height","text-width","align-left","align-center","align-right","align-justify","list","indent","video-camera","pencil","map-marker","adjust","tint","share-square-o","check-square-o","arrows","step-backward","fast-backward","backward","play","pause","stop","forward","fast-forward","step-forward","eject","chevron-left","chevron-right","plus-circle","minus-circle","times-circle","check-circle","question-circle","info-circle","crosshairs","times-circle-o","check-circle-o","ban","arrow-left","arrow-right","arrow-up","arrow-down","expand","compress","plus","minus","asterisk","exclamation-circle","gift","leaf","fire","eye","eye-slash","plane","calendar","random","comment","magnet","chevron-up","chevron-down","retweet","shopping-cart","folder","folder-open","arrows-v","arrows-h","twitter-square","facebook-square","camera-retro","key","comments","thumbs-o-up","thumbs-o-down","star-half","heart-o","sign-out","linkedin-square","thumb-tack","external-link","sign-in","trophy","github-square","upload","lemon-o","phone","square-o","bookmark-o","phone-square","twitter","github","unlock","credit-card","hdd-o","bullhorn","bell","certificate","hand-o-right","hand-o-left","hand-o-up","hand-o-down","arrow-circle-left","arrow-circle-right","arrow-circle-up","arrow-circle-down","globe","wrench","tasks","filter","briefcase","arrows-alt","cloud","flask","paperclip","square","list-ul","list-ol","strikethrough","underline","table","magic","truck","pinterest","pinterest-square","google-plus-square","google-plus","money","caret "google","reddit","reddit-square","stumbleupon-circle","stumbleupon","delicious","digg","pied-piper-pp","pied-piper-alt","drupal","joomla","language","fax","building","child","paw","spoon","cube","cubes","behance","behance-square","steam","steam-square","recycle","tree","spotify","deviantart","soundcloud","database","file-pdf-o","file-word-o","file-excel-o","file-powerpoint-o","file-code-o","vine","codepen","jsfiddle","circle-o-notch","git-square","git","tencent-weibo","qq","history","circle-thin","header","paragraph","sliders","share-alt","share-alt-square","bomb","tty","binoculars","plug","slideshare","twitch","yelp","newspaper-o","wifi","calculator","paypal","google-wallet","cc-visa","cc-mastercard","cc-discover","cc-amex","cc-paypal","cc-stripe","bell-slash","bell-slash-o","trash","copyright","at","eyedropper","paint-brush","birthday-cake","area-chart","pie-chart","line-chart","lastfm","lastfm-square","toggle-off","toggle-on","bicycle","bus","ioxhost","angellist","cc","meanpath","buysellads","connectdevelop","dashcube","forumbee","leanpub","sellsy","shirtsinbulk","simplybuilt","skyatlas","cart-plus","cart-arrow-down","diamond","ship","user-secret","motorcycle","street-view","heartbeat","venus","mars","mercury","transgender-alt","venus-double","mars-double","venus-mars","mars-stroke","mars-stroke-v","mars-stroke-h","neuter","genderless","facebook-official","pinterest-p","whatsapp","server","user-plus","user-times","viacoin","train","subway","medium","optin-monster","opencart","expeditedssl","mouse-pointer","i-cursor","object-group","object-ungroup","sticky-note","sticky-note-o","cc-jcb","cc-diners-club","clone","balance-scale","hourglass-o","hourglass","hand-scissors-o","hand-lizard-o","hand-spock-o","hand-pointer-o","hand-peace-o","trademark","registered","creative-commons","gg","gg-circle","tripadvisor","odnoklassniki","odnoklassniki-square","get-pocket","wikipedia-w","safari","chrome","firefox","opera","internet-explorer","contao","500px","amazon","calendar-plus-o","calendar-minus-o","calendar-times-o","calendar-check-o","industry","map-pin","map-signs","map-o","map","commenting","commenting-o","houzz","vimeo","black-tie","fonticons","reddit-alien","edge","credit-card-alt","codiepie","modx","fort-awesome","usb","product-hunt","mixcloud","scribd","pause-circle","pause-circle-o","stop-circle","stop-circle-o","shopping-bag","shopping-basket","hashtag","bluetooth","bluetooth-b","percent","gitlab","wpbeginner","wpforms","envira","universal-access","wheelchair-alt","question-circle-o","blind","audio-description","volume-control-phone","braille","assistive-listening-systems","glide","glide-g","low-vision","viadeo","viadeo-square","snapchat","snapchat-ghost","snapchat-square","pied-piper","first-order","yoast","themeisle","handshake-o","envelope-open","envelope-open-o","linode","address-book","address-book-o","user-circle","user-circle-o","user-o","id-badge","quora","free-code-camp","telegram","shower","podcast","window-maximize","window-minimize","window-restore","bandcamp","grav","etsy","imdb","ravelry","eercast","microchip","snowflake-o","superpowers","wpexplorer","meetup"];

var grid = document.getElementById('grid');
var buscar = document.getElementById('buscar');
var contador = document.getElementById('contador');
var toast = document.getElementById('toast');
document.getElementById('total').textContent = ICONS.length;
var toastTimer;

function render(filtro) {
  filtro = (filtro || '').trim().toLowerCase();
  var lista = filtro ? ICONS.filter(function(n){ return n.indexOf(filtro) !== -1; }) : ICONS;
  grid.innerHTML = '';
  if (lista.length === 0) {
    grid.innerHTML = '<div class="empty">Sin resultados para "' + filtro + '"</div>';
    contador.textContent = '0 iconos';
    return;
  }
  var frag = document.createDocumentFragment();
  lista.forEach(function(name){
    var cls = 'fa-' + name;
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.title = 'Clic para copiar: fa ' + cls;
    cell.dataset.cls = cls;
    cell.innerHTML = '<span class="fa ' + cls + '"></span><span class="name">' + name + '</span>';
    frag.appendChild(cell);
  });
  grid.appendChild(frag);
  contador.textContent = lista.length + ' iconos';
}

function copiar(texto, cell) {
  function ok() {
    cell.classList.add('copied');
    setTimeout(function(){ cell.classList.remove('copied'); }, 900);
    showToast('Copiado: ' + texto);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(ok, function(){ fallback(texto); ok(); });
  } else {
    fallback(texto); ok();
  }
}
function fallback(texto) {
  var ta = document.createElement('textarea');
  ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1400);
}

grid.addEventListener('click', function(e){
  var cell = e.target.closest('.cell');
  if (!cell) return;
  copiar('fa ' + cell.dataset.cls, cell);
});

buscar.addEventListener('input', function(){ render(this.value); });

document.getElementById('sizes').addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if (!btn) return;
  this.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  grid.dataset.size = btn.dataset.size;
});

render('');
</script>
</body>
</html>
